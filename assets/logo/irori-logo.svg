  <!-- 井桁凹槽：开口内先整块铺槽底（开口下沉 D1），再把朝镜头的内壁盖到上缘 ——
       没被槽底盖住的那一圈正好就是内壁，不用另算。火塘是槽底上又一个凹坑，同样
       的办法再来一次。两层深度都只可能透过开口看见，所以不必逐面排序 ——
       剪裁本身就是遮挡关系，圆角改了它也自己跟着走。 -->
