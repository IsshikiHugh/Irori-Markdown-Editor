name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The writing experience: types, pure logic, and the behaviour suite that defines
  # "the experience has not regressed".
  web:
    name: Frontend · types / unit / behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npx vite build
      - name: Behaviour tests (headless Chromium)
        run: npm run test:e2e -- --report
        env:
          # ubuntu-latest ships Chrome; harness.mjs also auto-discovers Playwright caches
          IRORI_CHROME: /usr/bin/google-chrome
      - name: Upload behaviour report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-report
          path: docs/acceptance/report.md
          if-no-files-found: ignore

  # irori-host, the remote-files server (server/): the script under the oldest and a current
  # Node, then the standalone binary built for this runner, on all three platforms.
  host:
    name: irori-host · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-baseline
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64-baseline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - name: Script, Node 18
        run: node --test tests/host/irori-host.test.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Script, Node 22
        run: node --test tests/host/irori-host.test.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Binary
        shell: bash
        run: |
          bun build --compile --target=bun-${{ matrix.target }} server/irori-host.mjs --outfile irori-host-bin
          bin=irori-host-bin
          [[ -f irori-host-bin.exe ]] && bin=irori-host-bin.exe
          IRORI_HOST_CMD=$bin node --test tests/host/irori-host.test.mjs

  # The shell. macOS is the only platform verified by hand, but the code is
  # compiled on all three from day one so the three-platform goal stays honest.
  shell:
    name: Shell · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies (WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Frontend bundle (the Tauri build needs dist/)
        run: npx vite build
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # The smoke test only runs on macOS — the one platform v1 commits to verifying.
      # It needs a real window session, so it may fail without failing the whole pipeline.
      - name: Smoke test (system WebView)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          npx tauri build --debug --bundles app
          ./scripts/smoke.sh
