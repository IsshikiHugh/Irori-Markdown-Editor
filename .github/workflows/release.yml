name: Release

# Releasing: push a `v*` tag; all four platforms are built, attached to a GitHub Release, and the
# release is published.
#
#   1. Bump the version (package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml must
#      agree) and add a `## vX.Y.Z — date` section to CHANGELOG.md; commit and push to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Flow: `prepare` checks the tag against the version, takes this version's notes from CHANGELOG.md
# and creates a draft release → the four platforms build in parallel and upload their installers →
# the draft is published only if every build succeeded. If any platform fails the release stays a
# draft instead of going out with a platform missing; fix it and re-run the failed jobs.
# Tags containing `-` (e.g. v0.2.0-beta.1) are published as pre-releases.
#
# A manual run (Actions → Release → Run workflow) never touches releases and only builds: the
# installers are in the Artifacts section at the bottom of that run's page (Windows ships
# nsis/*-setup.exe and msi/*.msi — either one works), kept for 90 days.
#
# Note: only macOS has been verified by hand. The Windows / Linux builds are "compiles
# and packages", not "verified" — don't treat them as supported platforms until someone has run
# the acceptance checklist on them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Needed to create releases and upload assets; new repositories give GITHUB_TOKEN read-only
# access by default, which fails with a 403
permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      # A mismatch would put a different version in the installer file names than in the tag —
      # stop here rather than building four platforms for nothing
      - name: Check the tag matches the version
        run: |
          want="${GITHUB_REF_NAME#v}"
          npm_ver=$(node -p "require('./package.json').version")
          conf_ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_ver=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$want package.json=$npm_ver tauri.conf.json=$conf_ver Cargo.toml=$cargo_ver"
          if [[ "$npm_ver" != "$want" || "$conf_ver" != "$want" || "$cargo_ver" != "$want" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version; set all three versions to $want before tagging"
            exit 1
          fi

      - name: Take this version's notes from CHANGELOG
        run: |
          # The section starting at `## vX.Y.Z`, up to the next `## v`
          awk -v head="## $GITHUB_REF_NAME" '
            index($0, head) == 1 && (length($0) == length(head) || substr($0, length(head) + 1, 1) == " ") { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [[ -z "$(tr -d '[:space:]' < notes.md)" ]]; then
            echo "::warning::CHANGELOG.md has no section for $GITHUB_REF_NAME; release notes left empty"
            echo "No changelog entry for this version." > notes.md
          fi
          cat notes.md

      # A re-run reuses the existing draft instead of creating a second one
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          pre=false
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=true
          if [[ -z "$id" ]]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Irori $GITHUB_REF_NAME" \
              -f body="$(cat notes.md)" -F draft=true -F prerelease=$pre --jq .id)
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f name="Irori $GITHUB_REF_NAME" -f body="$(cat notes.md)" -F prerelease=$pre > /dev/null
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: prepare
    # On a manual run `prepare` is skipped and the build must still happen; on a tag, a failed
    # `prepare` stops it
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - os: ubuntu-latest
            label: Linux
            args: ''
            rust-targets: ''
          - os: windows-latest
            label: Windows
            args: ''
            rust-targets: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies (WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # With an empty releaseId (manual run) this only builds, nothing is uploaded
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
      - name: Upload installers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: irori-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/**/*
          if-no-files-found: warn

  publish:
    name: Publish release
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Draft → published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" -F draft=false --jq .html_url
