name: Release

# Releasing is automatic: a version bump that reaches main is released once CI has passed on it.
#
#   1. Bump the version (package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml must
#      agree) and add a `## vX.Y.Z — date` section to CHANGELOG.md
#   2. Commit and push to main. When CI goes green on that commit, this workflow sees that
#      vX.Y.Z has no published release yet, builds all four platforms and publishes it (the tag
#      is created by the release, on that commit). Pushes that don't change the version find
#      the release already out and stop at `prepare`.
#
# Pushing a `v*` tag by hand still works and releases that tag (it has to match the version).
#
# Flow: `prepare` works out the version, takes its notes from CHANGELOG.md (a missing section is
# an error) and creates a draft release → the four platforms build in parallel and upload their
# installers plus signed updater bundles, and `host` uploads the irori-host binaries → `publish`
# assembles latest.json (what installed copies check for updates, via releases/latest) and
# publishes the draft — only if every build
# succeeded. If any platform fails the release stays a draft instead of going out with a
# platform missing; fix it and re-run the failed jobs. After it, `npm` publishes irori-host to npm
# at the same version (skipped, with a warning, while the NPM_TOKEN secret is not set).
# Versions containing `-` (e.g. 0.2.0-beta.1) are published as pre-releases, which installed
# copies are never offered.
#
# A manual run (Actions → Release → Run workflow) never touches releases and only builds: the
# installers are in the Artifacts section at the bottom of that run's page (Windows ships
# nsis/*-setup.exe and msi/*.msi — either one works), kept for 90 days.
#
# Note: only macOS has been verified by hand. The Windows / Linux builds are "compiles
# and packages", not "verified" — don't treat them as supported platforms until someone has run
# the acceptance checklist on them.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

# Needed to create releases and upload assets; new repositories give GITHUB_TOKEN read-only
# access by default, which fails with a 403
permissions:
  contents: write

# One release at a time: a hand-pushed tag and the CI-triggered run for the same commit must not
# race to create the same release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    # after CI: only a green run of a push to main (not a pull request, not a failure)
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.what.outputs.sha }}
      tag: ${{ steps.what.outputs.tag }}
      build: ${{ steps.what.outputs.build }}
      release: ${{ steps.what.outputs.release }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # build: whether to build at all; release: whether to publish what was built
      - name: What to do
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          npm_ver=$(node -p "require('./package.json').version")
          conf_ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_ver=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$npm_ver tauri.conf.json=$conf_ver Cargo.toml=$cargo_ver"
          # A mismatch would put different versions in the installer names and the release —
          # stop here rather than building four platforms for nothing
          if [[ "$npm_ver" != "$conf_ver" || "$npm_ver" != "$cargo_ver" ]]; then
            echo "::error::the three versions disagree; set package.json, tauri.conf.json and Cargo.toml to the same version"
            exit 1
          fi
          tag="v$npm_ver"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $npm_ver"
            exit 1
          fi
          # only published releases are visible here; a draft left by a failed run is picked up
          # again below
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>/dev/null; then
            echo "::notice::$tag is already released; nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Take this version's notes from CHANGELOG
        if: steps.what.outputs.release == 'true'
        env:
          TAG: ${{ steps.what.outputs.tag }}
        run: |
          # The section starting at `## vX.Y.Z`, up to the next `## v`
          awk -v head="## $TAG" '
            index($0, head) == 1 && (length($0) == length(head) || substr($0, length(head) + 1, 1) == " ") { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [[ -z "$(tr -d '[:space:]' < notes.md)" ]]; then
            echo "::error::CHANGELOG.md has no section for $TAG; add one before releasing"
            exit 1
          fi
          cat notes.md

      # A re-run reuses the existing draft instead of creating a second one
      - name: Create draft release
        id: release
        if: steps.what.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.what.outputs.tag }}
          SHA: ${{ steps.what.outputs.sha }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          pre=false
          [[ "$TAG" == *-* ]] && pre=true
          if [[ -z "$id" ]]; then
            # the tag does not have to exist yet: publishing creates it on this commit
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$SHA" -f name="Irori $TAG" \
              -f body="$(cat notes.md)" -F draft=true -F prerelease=$pre --jq .id)
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f name="Irori $TAG" -f body="$(cat notes.md)" -F prerelease=$pre > /dev/null
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - os: ubuntu-latest
            label: Linux
            args: ''
            rust-targets: ''
          - os: windows-latest
            label: Windows
            args: ''
            rust-targets: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies (WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Signed updater bundles for the self-update. Switched on here only: local builds have no
      # signing key, and asking for signatures without one fails the build. The key lives in the
      # repository secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD; its
      # public half is plugins.updater.pubkey in tauri.conf.json
      - name: Turn on updater bundles
        shell: bash
        run: |
          node -e '
            const f = "src-tauri/tauri.conf.json", fs = require("fs"), c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          '
      # With an empty releaseId (manual run) this only builds, nothing is uploaded
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # latest.json is written once, in `publish`, rather than merged by four parallel builds
          includeUpdaterJson: false
      - name: Upload installers
        if: needs.prepare.outputs.release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: irori-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/**/*
          if-no-files-found: warn

  # irori-host, the remote-files tool (server/), as standalone binaries: what server/install.sh
  # downloads. Built on macOS so the darwin binaries can be signed ad hoc; Bun cross-compiles the
  # rest from there.
  host:
    name: irori-host binaries
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # the same Bun as CI's host job, which tested a binary on each platform
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: ./scripts/build-host.sh dist-host
      - name: Test the binary this runner can run
        run: |
          gunzip -c dist-host/irori-host-darwin-arm64.gz > irori-host && chmod +x irori-host
          IRORI_HOST_CMD=./irori-host node --test tests/host/irori-host.test.mjs
      - name: Upload to the release
        if: needs.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # the release is still a draft, found by id: upload through the API rather than by tag.
        # A re-run first removes what an earlier attempt uploaded (a name can only be used once)
        run: |
          id=${{ needs.prepare.outputs.release_id }}
          for f in dist-host/*; do
            name=$(basename "$f")
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --paginate --jq ".[] | select(.name == \"$name\") | .id")
            [[ -n "$old" ]] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name" \
              -H 'content-type: application/octet-stream' --input "$f" --jq .name
          done
      - name: Upload binaries
        if: needs.prepare.outputs.release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: irori-host
          path: dist-host/*

  publish:
    name: Publish release
    needs: [prepare, build, host]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Assemble latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/updater-manifest.mjs
      - name: Draft → published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" -F draft=false --jq .html_url

  # irori-host on npm (`npx irori-host`), at the app's version, once the release is out. Needs the
  # repository secret NPM_TOKEN (an npm automation token); without it this job only says so.
  # A re-run skips a version that is already on npm.
  npm:
    name: Publish irori-host to npm
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::warning::NPM_TOKEN is not set; irori-host was not published to npm"
            exit 0
          fi
          ver=${TAG#v}
          if npm view "irori-host@$ver" version > /dev/null 2>&1; then
            echo "::notice::irori-host@$ver is already on npm"
            exit 0
          fi
          # server/package.json keeps 0.0.0 in the repository; the release stamps the real version
          npm version "$ver" --no-git-tag-version
          tag=latest
          [[ "$ver" == *-* ]] && tag=next
          npm publish --provenance --access public --tag "$tag"
