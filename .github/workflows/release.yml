name: Release

# 发版：推一个 `v*` tag，四个平台打包、挂到 GitHub Release 上并直接发布。
#
#   1. 改版本号（package.json、src-tauri/tauri.conf.json、src-tauri/Cargo.toml 三处一致），
#      在 CHANGELOG.md 里写好 `## vX.Y.Z — 日期` 这一节，提交并推到 main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# 流程：prepare 核对 tag 与版本号、从 CHANGELOG 取这一版的说明、建一个草稿 release →
# 四个平台并行打包、把安装包传上去 → 全部成功才把草稿发布出去。
# 任何一个平台失败，release 就停在草稿，不会发出一个缺平台的版本；修好后重跑失败的任务即可。
# tag 里带 `-`（如 v0.2.0-beta.1）的发成 pre-release。
#
# 手动运行（Actions 页 → Release → Run workflow）不碰 release，只打包：安装包在那次运行页面底部的
# Artifacts 里（Windows 是 nsis/*-setup.exe 与 msi/*.msi，二选一装即可），保留 90 天。
#
# 注意：只有 macOS 做过人工验收（ADR-0001）。Windows / Linux 的产物是「能编译、能打包」，
# 不是「已验证」——在有人真正跑过验收清单之前，不要把它们当成已支持的平台。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 要建 release、传安装包；新仓库默认给 GITHUB_TOKEN 的是只读权限，不写这行会 403
permissions:
  contents: write

jobs:
  prepare:
    name: 准备 release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      # 对不上的话安装包文件名里的版本号会和 tag 不一致 —— 在这里就停，不白跑四个平台
      - name: tag 与版本号一致
        run: |
          want="${GITHUB_REF_NAME#v}"
          npm_ver=$(node -p "require('./package.json').version")
          conf_ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_ver=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$want package.json=$npm_ver tauri.conf.json=$conf_ver Cargo.toml=$cargo_ver"
          if [[ "$npm_ver" != "$want" || "$conf_ver" != "$want" || "$cargo_ver" != "$want" ]]; then
            echo "::error::tag $GITHUB_REF_NAME 与版本号不一致，先把三处版本号改成 $want 再打 tag"
            exit 1
          fi

      - name: 从 CHANGELOG 取这一版的说明
        run: |
          # 取 `## vX.Y.Z` 开头的那一节，到下一个 `## v` 为止
          awk -v head="## $GITHUB_REF_NAME" '
            index($0, head) == 1 && (length($0) == length(head) || substr($0, length(head) + 1, 1) == " ") { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [[ -z "$(tr -d '[:space:]' < notes.md)" ]]; then
            echo "::warning::CHANGELOG.md 里没有 $GITHUB_REF_NAME 这一节，release 说明留空"
            echo "（CHANGELOG.md 里没有这一版的记录）" > notes.md
          fi
          printf '\n---\n\n只有 macOS 经过人工验收；Windows / Linux 的安装包能编译、能打包，但未经验证。\n' >> notes.md
          cat notes.md

      # 重跑时复用已有的那个草稿，不会建出第二个
      - name: 建草稿 release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          pre=false
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=true
          if [[ -z "$id" ]]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Irori $GITHUB_REF_NAME" \
              -f body="$(cat notes.md)" -F draft=true -F prerelease=$pre --jq .id)
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f name="Irori $GITHUB_REF_NAME" -f body="$(cat notes.md)" -F prerelease=$pre > /dev/null
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: prepare
    # 手动运行时 prepare 被跳过，也要照常打包；打 tag 时 prepare 失败就不打
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - os: ubuntu-latest
            label: Linux
            args: ''
            rust-targets: ''
          - os: windows-latest
            label: Windows
            args: ''
            rust-targets: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux 系统依赖（WebKitGTK）
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # releaseId 为空（手动运行）时只打包、不上传
      - name: 打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
      - name: 上传安装包
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: irori-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/**/*
          if-no-files-found: warn

  publish:
    name: 发布 release
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: 草稿 → 正式发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" -F draft=false --jq .html_url
